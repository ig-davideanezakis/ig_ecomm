name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: "22"
  # Vercel configuration — set these in GitHub Secrets:
  # Settings → Secrets and variables → Actions → New repository secret
  # - VERCEL_DEPLOY_HOOK: from Vercel project → Deploy Hooks
  # - VERCEL_TOKEN: from https://vercel.com/account/tokens
  # - VERCEL_PROJECT_ID: from Vercel project → Settings → General → Project ID
  VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  # E2E tests need real DB credentials. Set these in GitHub Secrets:
  # - DATABASE_URL: Supabase connection string
  # - AUTH_SECRET: NextAuth secret (same as .env)
  # - AUTH_RESEND_KEY: Resend API key (optional for E2E)
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
  AUTH_RESEND_KEY: ${{ secrets.AUTH_RESEND_KEY }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
      - name: Seed test users
        run: npx tsx scripts/seed-test-users.ts
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          # Override Playwright's webServer to not reuse — CI always starts fresh
          PLAYWRIGHT_REUSE_SERVER: "0"

  deploy:
    name: Deploy to Vercel
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Vercel Deploy Hook
        run: curl -X POST "${{ env.VERCEL_DEPLOY_HOOK }}"

      - name: Check Deployment Status
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_PROJECT_ID != '' }}
        continue-on-error: true
        run: |
          echo "⏳ Waiting for deployment to start..."
          sleep 15
          node scripts/check-deployment.js latest
        env:
          VERCEL_TOKEN: ${{ env.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
